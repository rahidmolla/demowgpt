<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WeatherGPT - Login</title>

    <link rel="stylesheet" href="auth.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

</head>

<body>
<button id="installBtn" class="install-btn" style="display: none;">
    📲 Install App
</button>
<div class="auth-container">

    <div class="weather-logo">
        ☁️
    </div>

    <h1>WeatherGPT</h1>

    <p class="subtitle">
        Your intelligent weather assistant
    </p>

    <div class="auth-card">

        <div class="tabs">
            <button id="loginTab" class="active">
                Login
            </button>

            <button id="signupTab">
                Sign Up
            </button>
        </div>

        <!-- LOGIN -->

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="auth-btn">
                Login
            </button>

            <p id="loginMessage"></p>

        </form>


        <!-- SIGNUP -->

        <form id="signupForm" class="hidden">

            <div class="input-group">
                <label>Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="input-group">
                <label>Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >
            </div>

            <button type="submit" class="auth-btn">
                Create Account
            </button>

            <p id="signupMessage"></p>

        </form>

    </div>

</div>

<script src="auth.js"></script>

</body>
</html>
